# k3d cluster config for the bigdata-ai-jobs-market project.
# Disposable, local-only cluster (see CLAUDE.md — no VPS, no permanent infra).
# Usage: `task k3d:up` / `task k3d:down` (see Taskfile.yml).
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: bigdata

servers: 1
agents: 2

# Ports are mapped away from 80/443 on the host to avoid clashing with any
# other local service; the ingress (Voila, later) is reachable via these.
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  - port: 8443:443
    nodeFilters:
      - loadbalancer

options:
  k3d:
    wait: true
    timeout: "2m0s"
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
