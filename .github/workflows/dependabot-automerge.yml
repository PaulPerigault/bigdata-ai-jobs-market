name: dependabot-automerge

# Enables auto-merge (it still waits for the required `ci` check) on Dependabot
# patch and minor updates. Majors are left for review, and so is everything
# that touches the infrastructure provider (label pkg:infra). The author of the PR is
# checked, never github.actor.
on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'pkg:infra')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: read the update type
        id: meta
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$TITLE" in
            *"from "*" to "*) ;;
            *) echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          old=$(printf '%s' "$TITLE" | sed -E 's/.* from v?([0-9]+)\..* to .*/\1/')
          new=$(printf '%s' "$TITLE" | sed -E 's/.* to v?([0-9]+)\..*/\1/')
          if [ "$old" = "$new" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; else echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: enable auto-merge (squash)
        if: steps.meta.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
