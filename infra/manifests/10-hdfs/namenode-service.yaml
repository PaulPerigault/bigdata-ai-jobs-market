# Headless service: stable per-pod DNS for the (single-replica) NameNode
# StatefulSet, referenced by CORE-SITE.XML_fs.defaultFS above.
apiVersion: v1
kind: Service
metadata:
  name: hdfs-namenode
  namespace: bigdata
  labels:
    app: hdfs-namenode
spec:
  clusterIP: None
  selector:
    app: hdfs-namenode
  ports:
    - name: rpc
      port: 9000
      targetPort: 9000
    - name: web-ui
      port: 9870
      targetPort: 9870
