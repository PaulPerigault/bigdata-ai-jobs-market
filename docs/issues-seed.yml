# Issues a creer - un item = un `gh issue create`, puis `gh issue develop
# <numero> --checkout` pour la branche liee (voir CLAUDE.md, workflow).
#
# labels `academic:required` = necessaire au bareme, ne jamais sauter.
# labels `team:*` = role responsable (voir docs/team-roles.md), pas un nom
# nominatif - a assigner a une vraie personne quand les pseudos sont connus.

issues:
  # ========================= J1 - team:infra =========================
  - day: J1
    team: infra
    title: "infra: bootstrap cluster k3d + namespace bigdata"
    labels: [type:infra, scope:k3d, team:infra, priority:p0]
    body: |
      Criteres : `k3d cluster list` montre le cluster, `kubectl get ns bigdata` existe.

  - day: J1
    team: infra
    title: "infra: squelette des dossiers infra/, spark-jobs/, voila-app/"
    labels: [type:infra, team:infra, priority:p1]
    body: |
      Structure definie dans CLAUDE.md (section "Structure de repo").

  - day: J1
    team: docs-qa
    title: "docs: squelettes docs/dataset-schema.md et docs/architecture.md"
    labels: [type:docs, team:docs-qa, priority:p2]
    body: |
      Schema du dataset (colonnes/types reels) + schema d'architecture (Mermaid).

  # ========================= J2 - team:infra =========================
  - day: J2
    team: infra
    title: "academic: arborescence HDFS raw/processed/output + depot du CSV"
    labels: [academic:required, type:infra, scope:hdfs, team:infra, priority:p0]
    body: |
      /projet_ia/{raw,processed/{offres,metiers,competences},output}, CSV
      depose et controle (-du, -cat/head, wc -l).

  - day: J2
    team: infra
    title: "academic: table Hive externe RAW + controles"
    labels: [academic:required, type:infra, scope:hive, team:infra, priority:p0]
    body: |
      CREATE EXTERNAL TABLE (TEXTFILE, header skip). SHOW TABLES, DESCRIBE,
      SELECT LIMIT 10, COUNT(*) + les 5 requetes Jour 1 obligatoires.

  - day: J2
    team: infra
    title: "infra: deploiement HDFS (NameNode/DataNode) sur k3d"
    labels: [type:infra, scope:hdfs, team:infra, priority:p0]
    body: |
      StatefulSet + PVC, namespace bigdata.

  - day: J2
    team: infra
    title: "infra: deploiement Hive Metastore + HiveServer2 (Postgres backend)"
    labels: [type:infra, scope:hive, team:infra, priority:p0]
    body: |
      Metastore backe Postgres, HiveServer2 expose dans le namespace.

  # ========================= J3 =========================
  - day: J3
    team: data-eng
    title: "academic: chargement Spark + controle qualite (nulls, doublons, types)"
    labels: [academic:required, type:infra, scope:spark, team:data-eng, priority:p0]
    body: |
      Charger le CSV en DataFrame, documenter les regles de nettoyage et
      pourquoi (table Controles qualite de report/sections/06-spark-quality.tex).

  - day: J3
    team: infra
    title: "infra: deploiement Spark Operator sur k3d"
    labels: [type:infra, scope:spark, team:infra, priority:p0]
    body: |
      Spark Operator installe, capable de soumettre des jobs PySpark.

  - day: J3
