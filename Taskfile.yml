version: "3"

vars:
  JOURNAL: JOURNAL.md

tasks:
  setup:
    desc: Installe pre-commit et ses hooks
    cmds:
      - pip install pre-commit
      - pre-commit install --install-hooks
      - pre-commit install --hook-type commit-msg

  lint:
    desc: Rejoue tous les checks pre-commit
    cmds:
      - pre-commit run --all-files

  up:
    desc: Démarre la stack (HDFS, Hive, Jupyter/PySpark) via Docker Compose
    cmds:
      - test -f .env || cp .env.example .env
      - docker compose up -d
      - task: log
        vars:
          TASK_NAME: up
          CMD: "docker compose up -d"
          RESULT: "stack démarrée (namenode, datanode, hive-metastore, hive-server, jupyter)"

  down:
    desc: Arrête la stack (les volumes nommés sont conservés)
    cmds:
      - docker compose down
      - task: log
        vars:
          TASK_NAME: down
          CMD: "docker compose down"
          RESULT: "stack arrêtée"

  ingest:
    desc: Dépose le CSV local dans HDFS /projet_ia/raw et vérifie le dépôt
    cmds:
      - bash scripts/01_ingest_hdfs.sh
      - task: log
        vars:
          TASK_NAME: ingest
          CMD: "bash scripts/01_ingest_hdfs.sh"
          RESULT: "voir sortie ls/du/wc -l ci-dessus"

  etl:
    desc: Lance le pipeline Spark de nettoyage/transformation (RAW -> processed)
    cmds:
      - docker compose exec jupyter spark-submit /home/jovyan/work/etl_pipeline.py
      - task: log
        vars:
          TASK_NAME: etl
          CMD: "docker compose exec jupyter spark-submit /home/jovyan/work/etl_pipeline.py"
          RESULT: "tables offres/metiers/competences (re)générées dans HDFS /projet_ia/processed"

  test:
    desc: Lance les tests unitaires (comptages, schémas)
    cmds:
      - pip install -e ".[test]"
      - pytest tests/ -v
      - task: log
        vars:
          TASK_NAME: test
          CMD: "pytest tests/ -v"
          RESULT: "voir sortie pytest ci-dessus"

  hive-shell:
    desc: Ouvre un shell Beeline connecté à HiveServer2
    cmds:
      - docker compose exec hive-server beeline -u jdbc:hive2://localhost:10000

  jupyter:
    desc: Affiche l'URL d'accès à Jupyter (token .env)
    cmds:
      - 'echo "http://localhost:8888/?token=$(grep JUPYTER_TOKEN .env | cut -d= -f2)"'

  report:
    desc: Compile report/main.tex en PDF via Docker (aucune installation LaTeX locale requise)
    cmds:
      - >-
        docker run --rm --platform linux/amd64
        -v "{{.PWD}}/report:/report" -w /report
        texlive/texlive:TL2025-historic
        bash -c "xelatex -interaction=nonstopmode -halt-on-error main.tex && xelatex -interaction=nonstopmode -halt-on-error main.tex"
      - task: log
        vars:
          TASK_NAME: report
          CMD: "docker run --rm --platform linux/amd64 -v report:/report texlive/texlive:TL2025-historic xelatex (2 passes)"
          RESULT: "report/main.pdf régénéré, voir nombre de pages dans la sortie xelatex ci-dessus"
    vars:
      PWD:
        sh: pwd

  screenshots-cli:
    desc: Régénère les captures terminal/requêtes de report/figures/ (freeze)
    cmds:
      - bash scripts/screenshots_cli.sh
      - task: log
        vars:
          TASK_NAME: screenshots-cli
          CMD: "bash scripts/screenshots_cli.sh"
          RESULT: "captures terminal/requêtes régénérées dans report/figures/"

  screenshots-web:
    desc: Régénère les captures HDFS NameNode / Jupyter de report/figures/ (Playwright)
    cmds:
      - test -d .venv-screenshots || python3 -m venv .venv-screenshots
      - .venv-screenshots/bin/pip install -q -e ".[screenshots]"
      - .venv-screenshots/bin/playwright install chromium
      - .venv-screenshots/bin/python scripts/screenshots_web.py
      - task: log
        vars:
          TASK_NAME: screenshots-web
          CMD: ".venv-screenshots/bin/python scripts/screenshots_web.py"
          RESULT: "captures HDFS NameNode/Jupyter régénérées dans report/figures/"

  log:
    internal: true
    cmds:
      - |
        {
          echo ""
          echo "## $(date '+%Y-%m-%d %H:%M') — task {{.TASK_NAME}}"
          echo "Commande : {{.CMD}}"
          echo "Résultat : {{.RESULT}}"
          echo "Auteur : task automation"
        } >> {{.JOURNAL}}
