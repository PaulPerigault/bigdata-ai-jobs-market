name: Feature
description: A new capability of a package or of the documentation.
title: 'feat: '
labels: ['type:fonction']
assignees: [PaulPerigault]
body:
  - type: markdown
    attributes:
      value: |
        One issue per step. If it does not fit one working session, open a parent
        "Chantier" issue and split it. Never report a vulnerability here: see SECURITY.md.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: The observed need or defect, with a source or an example. Facts, not intentions.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What a user or a maintainer can do once this is closed, in two or three sentences.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Each box is checked by a command, a test or a capture.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [compose, etl, sql, notebook, report, data, ci, docs, processus]
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: trait = 30 minutes at most; page = one session; cahier = split it.
      options: [trait, page, cahier]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [bloquant, haute, normale, basse]
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone to attach
      description: Not settable from the form; the owner or Claude Code sets it.
      options:
        - v0.1.0 Initial public release
        - v0.2.0 Reproducible local run
        - v0.3.0 Analysis quality
        - v0.4.0 Modern stack
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue does not cover.
  - type: checkboxes
    id: done
    attributes:
      label: Definition of done
      options:
        - label: Tests added, `task verify` green.
          required: true
        - label: Documentation up to date (README, ADR or journal).
          required: true
        - label: PR linked with `Closes #n`.
          required: true
