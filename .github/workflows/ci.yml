name: CI

on:
  pull_request:
    branches: [main]
    # `edited`: the PR title and body become the squash commit message.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1' # weekly: new advisories land without any commit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TASK_VERSION: 3.54.0
  UV_VERSION: 0.13.8

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen
      - run: task fmt:check
      - run: task lint

  commitlint:
    # Title and body of the PR are the future squash commit.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s (#%s)\n\n%s\n' "$PR_TITLE" "$PR_NUMBER" "$PR_BODY" > "$RUNNER_TEMP/msg"
          go run ./dev/commitlint "$RUNNER_TEMP/msg"

  test:
    # Spark 3.5.0 needs Java 11 or 17: REQUIRE_SPARK=1 makes a missing JVM a failure, never a skip.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUIRE_SPARK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen
      - run: task test

  docs-and-data:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen
      - name: docs match the repository
        run: task check:docs
      - name: the synthetic sample is reproducible
        run: task data:check
      - name: skills match their lock
        run: task skills:verify
      - name: Compose files are valid and every image is pinned by digest
        run: task compose:check

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - name: gitleaks on the tree and the history (tool pinned by tools/go.sum)
        run: task security
      - name: Trivy on the repository (image pinned by digest)
        run: task docker:scan

  codeql:
    # The SARIF upload needs GitHub Advanced Security: free on a public repository only.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # the SARIF upload reads the workflow run
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # the SARIF upload reads the workflow run (public repository only)
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Private repository: findings fail the job and print in the log, no SARIF upload.
          advanced-security: ${{ github.event.repository.private == false }}

  # The only required check: branch protection points here.
  ci:
    if: always()
    needs: [lint, commitlint, test, docs-and-data, security, codeql, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job succeeded or was skipped (commitlint on PRs only, codeql on public repositories only)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
