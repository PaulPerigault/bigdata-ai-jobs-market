# Headless service: stable per-pod DNS for the DataNode StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: hdfs-datanode
  namespace: bigdata
  labels:
    app: hdfs-datanode
spec:
  clusterIP: None
  selector:
    app: hdfs-datanode
  ports:
    - name: rpc
      port: 9866
      targetPort: 9866
    - name: web-ui
      port: 9864
      targetPort: 9864
