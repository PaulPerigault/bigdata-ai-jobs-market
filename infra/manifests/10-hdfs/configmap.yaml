# Shared Hadoop config, consumed by both the namenode and datanode
# StatefulSets via envFrom. Uses the apache/hadoop image's env-to-config
# convention (envtoconf.py): "<FILE>_<dotted.key>" -> <file>.<ext>.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hdfs-config
  namespace: bigdata
data:
  CORE-SITE.XML_fs.defaultFS: "hdfs://hdfs-namenode:9000"
  HDFS-SITE.XML_dfs.replication: "2"
